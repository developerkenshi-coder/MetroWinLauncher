name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # lintDebug is left out: it reports 6 errors that were already there (see app/build/reports/lint-results-debug.html).
      - run: ./gradlew testDebugUnitTest assembleDebug

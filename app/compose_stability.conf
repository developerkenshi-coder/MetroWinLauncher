// Types the Compose compiler cannot see are immutable. Strong skipping compares an unstable parameter by identity; these are compared by
// equals, so a new list or date with the same content does not recompose. The state lists of Compose are not equal by content, so they stay safe.
java.time.*
java.io.File
kotlin.collections.*
// The classes of :logic (plain Kotlin, no var): the Compose compiler cannot see into another module, so they are named here, as they were seen inside :app.
com.metrowin.launcher.data.DisplayModeInfo
com.metrowin.launcher.data.MetroSound
com.metrowin.launcher.data.RestorePart
com.metrowin.launcher.data.SearchEngine
